{% extends "base.html" %}
{% block title %}
Login | CyberGuard
{% endblock %}
{% block content %}
<div class="auth">
<div class="authbox">
<div class="authicon">🛡️</div>
<small>WELCOME BACK</small>
<h1>Login to CyberGuard</h1>
<p>Continue your security learning journey.</p>
<form method="post">
<label>Email</label>
<input type="email" name="email" required placeholder="you@example.com">
<label>Password</label>
<input type="password" name="password" required placeholder="Password">
<button class="btn">Login →</button>
</form>
<p>Don't have an account? <a href="/register">Create one</a>
</p>
</div>
</div>
{% endblock %}
